plugins {
    id 'java'
}

group = 'com.example'
version = '0.1.0'

java {
    toolchain {
        // 使用 Java 21 以兼容 Paper 1.20.5
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    // 添加 Kyori 仓库，用于下载 Adventure 依赖
    maven {
        name = 'kyori'
        url = 'https://repo.kyori.net/repository/maven-public/'
    }
    maven {
        name = 'kyori-snapshots'
        url = 'https://repo.kyori.net/repository/maven-snapshots/'
    }
}

// 强制使用稳定版的 Adventure BOM，避免快照丢失导致下载失败
configurations.all {
    resolutionStrategy {
        force 'net.kyori:adventure-bom:4.17.0'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.5-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
